packages:
  - packages/*
  - apps/*

catalog:
  "@babel/parser": ^7.29.8
  "@babel/traverse": ^7.29.8
  "@babel/types": ^7.29.8
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@commitlint/types": ^21.2.0
  "@playwright/test": ^1.62.1
  "@scalar/api-reference-react": ^0.9.63
  "@seriousme/openapi-schema-validator": ^2.9.1
  "@tailwindcss/postcss": ^4.3.3
  "@types/babel__traverse": ^7.28.0
  "@types/fs-extra": ^11.0.4
  "@types/node": ^26.2.0
  "@types/swagger-ui-react": ^5.18.0
  "@vitest/coverage-v8": ^4.1.10
  autoprefixer: ^10.5.4
  babel-plugin-react-compiler: ^1.0.0
  commander: ^15.0.0
  cross-env: ^10.1.0
  conventional-changelog-cli: ^5.0.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  drizzle-zod: ^0.8.3
  eslint-plugin-turbo: ^2.10.10
  fs-extra: ^11.4.0
  js-yaml: ^5.3.0
  knip: ^6.32.2
  lint-staged: ^17.3.0
  np: ^12.0.1
  ora: ^9.4.1
  oxfmt: ^0.63.0
  oxlint: ^1.78.0
  oxlint-tsgolint: ^7.0.2001
  postcss: ^8.5.26
  postgres: ^3.4.9
  simple-git-hooks: ^2.13.1
  swagger-ui-react: ^5.32.13
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  turbo: ^2.10.10
  typescript: 7.0.2
  vitest: ^4.1.10
  zod: ^4.4.3
  cross-spawn: ^7.0.6
  "@types/cross-spawn": ^6.0.6

catalogMode: strict

catalogs:
  typescript-classic:
    typescript: npm:@typescript/typescript6@6.0.2
  nextjs:
    "@next/playwright": 16.3.1
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    next: 16.3.1
    react: 19.2.8
    react-dom: 19.2.8
  react-router:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    "@vitejs/plugin-react": ^6.0.5
    react: 19.2.8
    react-dom: 19.2.8
    react-router: ^8.3.0
    vite: ^8.2.1
  tanstack:
    "@tanstack/react-router": ^1.170.29
    "@tanstack/react-start": ^1.168.46
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.4
    "@vitejs/plugin-react": ^6.0.5
    react: 19.2.8
    react-dom: 19.2.8
    vite: ^8.2.1
  zod3:
    zod: ^3.25.76

pmOnFail: download

saveWorkspaceProtocol: rolling

trustLockfile: true

# swagger-ui-react still declares React 18 peers on some transitive deps; React 19 is compatible.
peerDependencyRules:
  allowedVersions:
    react: "19"

strictPeerDependencies: true

packageExtensions:
  "knip@*":
    dependencies:
      "@types/minimist": "*"

allowBuilds:
  "@scarf/scarf": false
  "@tree-sitter-grammars/tree-sitter-yaml": true
  core-js-pure: false
  esbuild: true
  sharp: true
  simple-git-hooks: true
  tree-sitter: true
  tree-sitter-json: true
  vue-demi: true

overrides:
  brace-expansion: 5.0.9
  esbuild: ">=0.28.2"
  fast-uri: 3.1.5
  js-yaml@>=4.0.0 <5: 4.3.1
  postcss: ">=8.5.26"
  tmp: ">=0.2.7"
